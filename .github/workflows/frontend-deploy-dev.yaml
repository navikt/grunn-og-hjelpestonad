name: "frontend: Deploy til dev"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-deploy-dev.yaml"

permissions:
  contents: "read"
  id-token: "write"
  actions: "read"

concurrency:
  group: frontend-deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg og push Docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
          registry-url: "https://npm.pkg.github.com"
      - name: Installer avhengigheter
        working-directory: apps/frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Kjør ESLint
        working-directory: apps/frontend
        run: pnpm run lint
      - name: Kjør tester
        working-directory: apps/frontend
        run: pnpm test
      - name: Bygg applikasjon
        working-directory: apps/frontend
        run: |
          pnpm run build
          pnpm run build:server
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: grunn-og-hjelp
          docker_context: apps/frontend
          image_suffix: frontend
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy:
    name: Deploy til dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/frontend/.nais/dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
