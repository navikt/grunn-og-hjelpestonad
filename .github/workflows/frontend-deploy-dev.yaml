name: "frontend: Deploy til dev"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-deploy-dev.yaml"

permissions:
  contents: "read"
  id-token: "write"
  actions: "read"

jobs:
  build:
    name: Bygg og push Docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: "https://npm.pkg.github.com"
      - name: Installer npm-avhengigheter
        working-directory: apps/frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: npm ci
      - name: Kjør ESLint
        working-directory: apps/frontend
        run: npm run lint
      - name: Bygg applikasjon
        working-directory: apps/frontend
        run: |
          npm run build
          npm run build:server
      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: grunn-og-hjelp
          docker_context: apps/frontend
          image_suffix: frontend
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy:
    name: Deploy til dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/frontend/.nais/dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
