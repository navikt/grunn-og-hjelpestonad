apiVersion: nais.io/v1alpha1
kind: Application
metadata:
    name: grunn-og-hjelpestonad-infotrygd
    namespace: grunn-og-hjelp

spec:
    # Applikasjon konfigurasjon
    image: {{ image }}
    port: 8080
    replicas:
        min: 1
        max: 2
    resources:
        requests:
            cpu: 20m
            memory: 256Mi
        limits:
            memory: 512Mi
    gcp:
        sqlInstances:
            -   name: grunn-og-hjelpestonad-infotrygd
                type: POSTGRES_18
                tier: db-g1-small
                diskAutoresize: true
                cascadingDelete: false
                highAvailability: false
                pointInTimeRecovery: true
                maintenance:
                    day: 7
                    hour: 23
                databases:
                    -   name: grunn-og-hjelpestonad-infotrygd
                        envVarPrefix: DB

    # Nettverk
    ingresses:
        - https://grunn-og-hjelpestonad-infotrygd.intern.dev.nav.no
    accessPolicy:
        inbound:
            rules:
                -   application: grunn-og-hjelpestonad
                    cluster: dev-gcp
        outbound:
            rules:
                -   application: grunn-og-hjelpestonad
                    cluster: dev-gcp
                -   application: grunn-og-hjelp-exodus
                    cluster: dev-fss

                    # Team logs
                -   application: logging
                    namespace: nais-system

    # Helse
    liveness:
        path: /internal/health/liveness
        initialDelay: 30
        failureThreshold: 10
    readiness:
        path: /internal/health/readiness
        initialDelay: 30
        failureThreshold: 10

    # Logging
    prometheus:
        enabled: true
        path: /internal/prometheus
    observability:
        autoInstrumentation:
            enabled: true
            runtime: java
        logging:
            destinations:
                -   id: loki
                -   id: elastic

    #Autentisering
    azure:
        application:
            enabled: true
            tenant: trygdeetaten.no
            claims:
                groups:
                    - id: 7ce9d1d2-d149-4324-832b-8d459762a102 # Saksbehandler
                    - id: 84c4a287-abd6-46c1-bf93-dbf90f1a326d # Beslutter
                    - id: a181921e-2a55-4198-896b-0086cc805278 # Lesetilgang
                extra:
                    - "NAVident"
                    - "azp_name"
