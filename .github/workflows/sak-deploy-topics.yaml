name: "sak: Deploy Kafka topics"
on:
  workflow_dispatch:

permissions:
  contents: "read"
  id-token: "write"

jobs:
  deploy-topics-dev:
    name: Deploy Kafka topics til dev-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/sak/.nais/kafka/utbetaling-topic-dev.yaml
  deploy-topics-prod:
    name: Deploy Kafka topics til prod-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/sak/.nais/kafka/utbetaling-topic-prod.yaml
