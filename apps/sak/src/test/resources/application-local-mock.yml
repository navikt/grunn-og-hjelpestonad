# Mock profil - Fullt lokal uten eksterne avhengigheter
# Start: ./start-mock.sh, kjør ApplicationLocalMock i IntelliJ

# Server konfigurasjon
server:
    port: 8082

# Spring konfigurasjon
spring:
    main:
        allow-bean-definition-overriding: true
    datasource:
        url: jdbc:postgresql://localhost:5432/grunn-og-hjelpestonad
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: test
        hikari:
            maximum-pool-size: 3
            connection-test-query: "select 1"
            max-lifetime: 900000
            minimum-idle: 1
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8089/default
                    jwk-set-uri: http://localhost:8089/default/jwks
                    audiences: default

# Azure AD mock konfigurasjon
# De flate AZURE_*-nøklene mater plassholdere i application.yml som ikke
# overstyres her (blant annet spring.security.oauth2...audiences).
AZURE_OPENID_CONFIG_ISSUER: http://localhost:8089/default
AZURE_APP_CLIENT_ID: mock-client-id
AZURE_APP_TENANT_ID: mock-tenant-id

azure:
    app:
        tenant:
            id: mock-tenant-id
        client:
            id: mock-client-id
            secret: mock-client-secret
    authorization-url: http://localhost:8089/default/authorize
    token-endpoint-url: http://localhost:8089/default/token
    api-scope: mock-scope

nais:
    miljo: local-mock
    texas:
        token-endpoint: http://localhost:8090/texas/api/v1/token/token
        token-exchange-endpoint: http://localhost:8090/texas/api/v1/token/exchange

# Eksterne tjenester -> WireMock
integrasjoner:
    infotrygd:
        url: http://localhost:8090
        scope: mock-scope
    entra-proxy:
        url: http://localhost:8090
        scope: mock-scope
    familie-dokument:
        url: http://localhost:8090
        scope: mock-scope
    pdl:
        url: http://localhost:8090
        scope: mock-scope
    saf:
        url: http://localhost:8090
        scope: mock-scope
    tilgangsmaskin:
        url: http://localhost:8090
        scope: mock-scope

# Swagger/OpenAPI konfigurasjon
springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
        try-it-out-enabled: true
        disable-swagger-default-url: true
        persist-authorization: true
        oauth:
            use-pkce-with-authorization-code-grant: true
            client-id: mock-client-id

# NAIS
NAIS_NAMESPACE: grunn-og-hjelp
NAIS_CLUSTER_NAME: local-mock

# Task prosessering konfigurasjon
prosessering:
    rolle: 00000000-0000-0000-0000-000000000000
    fixedDelayString:
        in:
            milliseconds: 3000
