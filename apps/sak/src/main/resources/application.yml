# Server konfigurasjon
server:
    port: 8080

# Spring konfigurasjon
spring:
    application:
        name: grunn-og-hjelpestonad

    threads:
        virtual:
            enabled: true

    main:
        keep-alive: true

    http:
        clients:
            connect-timeout: 5s
            read-timeout: 10s

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
                    audiences: ${AZURE_APP_CLIENT_ID}

    # Flyway database migrering
    flyway:
        enabled: true
        locations: classpath:db/migration
        placeholders:
            ignoreIfProd:

    # Database konfigurasjon
    datasource:
        url: ${DB_JDBC_URL}
        hikari:
            maximum-pool-size: 20
            connection-test-query: "select 1"
            max-lifetime: 90000
            minimum-idle: 1

    # Kafka konfigurasjon
    #    TODO lånt fra historisk, sjekk opp
    kafka:
        bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
        security:
            protocol: SSL
        ssl:
            trust-store-type: JKS
            trust-store-location: file:${KAFKA_TRUSTSTORE_PATH:}
            trust-store-password: ${KAFKA_CREDSTORE_PASSWORD:}
            key-store-type: PKCS12
            key-store-location: file:${KAFKA_KEYSTORE_PATH:}
            key-store-password: ${KAFKA_CREDSTORE_PASSWORD:}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            group-id: ${spring.application.name}

# Management og health endepunkter
management:
    endpoint:
        health:
            show-details: always
            probes:
                enabled: true
    endpoints:
        web:
            exposure:
                include: health,prometheus
            base-path: /internal

nais:
    app-navn: ${NAIS_APP_NAME:grunn-og-hjelpestonad}
    texas:
        token-endpoint: ${NAIS_TOKEN_ENDPOINT}
        token-exchange-endpoint: ${NAIS_TOKEN_EXCHANGE_ENDPOINT}

# Azure AD konfigurasjon
azure:
    app:
        tenant:
            id: ${AZURE_APP_TENANT_ID}
        client:
            id: ${AZURE_APP_CLIENT_ID}
            secret: ${AZURE_APP_CLIENT_SECRET}
    authorization-url: https://login.microsoftonline.com/${azure.app.tenant.id}/oauth2/v2.0/authorize
    token-endpoint-url: https://login.microsoftonline.com/${azure.app.tenant.id}/oauth2/v2.0/token
    api-scope: api://${azure.app.client.id}/.default

# Eksterne tjenester
integrasjoner:
    infotrygd:
        url: https://grunn-og-hjelpestonad-infotrygd.dev-fss-pub.nais.io
        scope: api://dev-fss.grunn-og-hjelp.grunn-og-hjelpestonad-infotrygd/.default
    entra-proxy:
        url: http://entra-proxy.sikkerhetstjenesten
        scope: api://dev-gcp.sikkerhetstjenesten.entra-proxy/.default
    familie-dokument:
        url: http://familie-dokument.teamfamilie
        scope: api://${nais.miljo}-gcp.teamfamilie.familie-dokument/.default
    pdl:
        url: https://pdl-api.dev-fss-pub.nais.io
        scope: api://dev-fss.pdl.pdl-api/.default
    oppgave:
        url: https://oppgave.dev-fss-pub.nais.io
        scope: api://dev-fss.oppgavehandtering.oppgave/.default
    dokarkiv:
        url: https://dokarkiv-q2.dev-fss-pub.nais.io
        scope: api://dev-fss.teamdokumenthandtering.dokarkiv/.default
    dokdist:
        url: https://dokdistfordeling.dev-fss-pub.nais.io
        scope: api://dev-fss.teamdokumenthandtering.dokdistfordeling/.default
    saf:
        url: https://saf-q2.dev-fss-pub.nais.io
        scope: api://dev-fss.teamdokumenthandtering.saf/.default
    tilgangsmaskin:
        url: http://populasjonstilgangskontroll.tilgangsmaskin
        scope: api://dev-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default

# Swagger/OpenAPI konfigurasjon
springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
        try-it-out-enabled: true
        disable-swagger-default-url: true
        persist-authorization: true
        oauth:
            use-pkce-with-authorization-code-grant: true
            client-id: ${azure.app.client.id}
            scope-separator: ","

app:
    utbetaling:
        utbetaling-topic: etterlatte.utbetaling-bs.v1
        simulering-response-topic: helved.dryrun-respons.v1
        status-topic: helved.status.v1

# Task prosessering konfigurasjon
prosessering:
    rolle: 928636f4-fd0d-4149-978e-a6fb68bb19de # 0000-GA-STDAPPS
    continuousRunning:
        enabled: true
    fixedDelayString:
        in:
            milliseconds: 15000
    delete:
        after:
            weeks: 16

unleash:
    api:
        url: http://localhost:4242/api
