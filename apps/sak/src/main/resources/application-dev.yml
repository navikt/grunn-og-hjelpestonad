nais:
    miljo: dev

oppdrag:
    # Midlertidig: simuler og iverksett med en testandel når behandlingen mangler tilkjent ytelse.
    bruk-testandel-hvis-mangler: true
    iverksetting:
        # Midlertidig: endepunkt for å teste iverksetting mot oppdrag. Skal ikke settes i prod.
        testendepunkt-aktivert: true

unleash:
    enabled: true
    api:
        url: https://grunn-og-hjelp-unleash-api.nav.cloud.nais.io/api
        token: ${UNLEASH_SERVER_API_TOKEN}
