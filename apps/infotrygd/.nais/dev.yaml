apiVersion: nais.io/v1alpha1
kind: Application
metadata:
    name: grunn-og-hjelpestonad-infotrygd
    namespace: etterlatte

spec:
    # Applikasjon konfigurasjon
    image: {{ image }}
    port: 8080
    replicas:
        min: 1
        max: 2
    resources:
        requests:
            cpu: 20m
            memory: 256Mi
        limits:
            memory: 512Mi
    env:
        -   name: APP_DATASOURCE_URL
            value: jdbc:oracle:thin:@a01dbfl058.adeo.no:1521/infotrygd_ebq
        -   name: APP_DATASOURCE_PLATFORM
            value: org.hibernate.dialect.OracleDialect
        -   name: APP_DATASOURCE_DRIVER
            value: oracle.jdbc.driver.OracleDriver
        -   name: APP_JPA_PLATFORM
            value: org.hibernate.dialect.OracleDialect
        -   name: APP_DEFAULT_SCHEMA
            value: INFOTRYGD_EBQ
        -   name: APP_AZURE_PROXY_URL
            value: https://webproxy-nais.nav.no:8088
    vault:
        enabled: true
        paths:
            -   kvPath: /oracle/data/dev/creds/eb_infotrygd_q1-user
                mountPath: /var/run/secrets/oracle/creds

    # Nettverk
    ingresses:
        - https://grunn-og-hjelpestonad-infotrygd.dev-fss-pub.nais.io
    accessPolicy:
        inbound:
            rules:
                -   application: grunn-og-hjelpestonad
                    cluster: dev-gcp
                -   application: grunn-og-hjelpestonad-lokal
                    cluster: dev-gcp
        outbound:
            rules:
                -   application: grunn-og-hjelpestonad
                    cluster: dev-gcp

                    # Team logs
                -   application: logging
                    namespace: nais-system

    # Helse
    liveness:
        path: /internal/health/liveness
        initialDelay: 30
        failureThreshold: 10
    readiness:
        path: /internal/health/readiness
        initialDelay: 30
        failureThreshold: 10

    # Logging
    prometheus:
        enabled: true
        path: /internal/prometheus
    observability:
        autoInstrumentation:
            enabled: true
            runtime: java
        logging:
            destinations:
                -   id: loki
                -   id: elastic

    #Autentisering
    azure:
        application:
            enabled: true
            tenant: trygdeetaten.no
            claims:
                groups:
                    - id: 7ce9d1d2-d149-4324-832b-8d459762a102 # Saksbehandler
                    - id: 84c4a287-abd6-46c1-bf93-dbf90f1a326d # Beslutter
                    - id: a181921e-2a55-4198-896b-0086cc805278 # Lesetilgang
                extra:
                    - "NAVident"
                    - "azp_name"
