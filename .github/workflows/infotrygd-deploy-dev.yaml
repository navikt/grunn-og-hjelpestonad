name: "infotrygd: Deploy til dev"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/infotrygd/**"
      - ".github/workflows/infotrygd-deploy-dev.yaml"

jobs:
  build:
    name: Bygg og push Docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Bygg med Maven
        working-directory: apps/infotrygd
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn -B --no-transfer-progress package --settings .m2/maven-settings.xml --file pom.xml
      - uses: nais/docker-build-push@6394144a53cad0332745f24a8302f5efaf81719a
        id: docker-push
        with:
          team: grunn-og-hjelp
          docker_context: apps/infotrygd
          image_suffix: infotrygd
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
  deploy:
    name: Deploy til dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/infotrygd/.nais/dev.yaml
          IMAGE: ${{ needs.build.outputs.image }}
