services:
    # PostgreSQL (mock-profil)
    postgres:
        image: postgres:17
        container_name: grunn-og-hjelpestonad-postgres-1
        profiles: ["mock"]
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: grunn-og-hjelpestonad
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: test
        volumes:
            - postgres-data:/var/lib/postgresql/data
        labels:
            - "com.docker.compose.project=grunn-og-hjelpestonad"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    # Mock profil: OAuth2 mock server
    mock-oauth2-server:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        container_name: grunn-og-hjelpestonad-mock-oauth2-1
        profiles: ["mock"]
        ports:
            - "8089:8080"
        environment:
            LOG_LEVEL: INFO
        labels:
            - "com.docker.compose.project=grunn-og-hjelpestonad"

    # Mock profil: WireMock for integrasjonsmocks
    wiremock:
        image: wiremock/wiremock:3.13.2
        container_name: grunn-og-hjelpestonad-wiremock-1
        profiles: ["mock"]
        ports:
            - "8090:8080"
        volumes:
            - ./wiremock:/home/wiremock
        command: --verbose --global-response-templating
        labels:
            - "com.docker.compose.project=grunn-og-hjelpestonad"

volumes:
    postgres-data:
