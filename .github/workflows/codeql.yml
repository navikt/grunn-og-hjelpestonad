name: "CodeQL"

# TODO: Midlertidig workaround for Kotlin 2.3.20 — CodeQL 2.25.1 støtter ikke 2.3.20,
# og backend-appene er rent Kotlin, så `build-mode: none` finner ingen Java å analysere.
# Vi lar analyze steget feile mykt med continue on error til 2.25.2.
# Se: https://github.com/github/codeql/issues/21484
# Når 2.25.2 er ute:
# - Fjern continue on error.
# - Sett tilbake `build-mode: manual`, `languages: java-kotlin`.
# - Legg tilbake JDK 21-setup og "Build with Maven" steget.

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    schedule:
        -   cron: '0 6 * * 1'

jobs:
    analyze-java:
        name: Analyze (java)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    persist-credentials: false

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
                with:
                    languages: java
                    build-mode: none

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
                continue-on-error: true
                with:
                    category: "/language:java"

    analyze-javascript:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    persist-credentials: false

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
                with:
                    languages: javascript-typescript
                    build-mode: none

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
                with:
                    category: "/language:javascript-typescript"
