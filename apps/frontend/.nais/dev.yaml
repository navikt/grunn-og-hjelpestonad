apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: grunn-og-hjelpestonad-frontend
  namespace: grunn-og-hjelp
  labels:
    team: grunn-og-hjelp

spec:
  # Applikasjon konfigurasjon
  port: 8080
  replicas:
    max: 2
    min: 2
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  # Nettverk
  ingresses:
    - https://grunn-og-hjelpestonad.intern.dev.nav.no
    - https://grunn-og-hjelpestonad.ansatt.dev.nav.no

  # Helse
  liveness:
    path: /isAlive
    initialDelay: 10
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    path: /isReady
    initialDelay: 5

  # Observability
  prometheus:
    enabled: true
    path: /metrics
  frontend:
    generatedConfig:
      mountPath: /tmp/nais.js
  observability:
    autoInstrumentation:
      # runtime: sdk gir OTEL-miljøvariablene uten å injisere agenten.
      # Node-agenten bruker `--require`, som ikke patcher ESM-imports – appen
      # setter derfor opp OpenTelemetry-SDK-en selv i app/server/otel.ts.
      enabled: true
      runtime: sdk
    logging:
      destinations:
        - id: loki
        - id: elastic

  # Autentisering
  azure:
    application:
      enabled: true
      allowAllUsers: false
      tenant: trygdeetaten.no
      replyURLs:
        - https://grunn-og-hjelpestonad.intern.dev.nav.no/oauth2/callback
      claims:
        groups:
          - id: 7ce9d1d2-d149-4324-832b-8d459762a102 # Saksbehandler
          - id: 84c4a287-abd6-46c1-bf93-dbf90f1a326d # Beslutter
          - id: a181921e-2a55-4198-896b-0086cc805278 # Lesetilgang
    sidecar:
      enabled: true
      autoLogin: true

  accessPolicy:
    outbound:
      rules:
        - application: grunn-og-hjelpestonad

  env:
    - name: APP_VERSION
      value: '{{version}}'
    - name: ENV
      value: development
